<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Recipes</title>
</head>
<body>
    <h1>Quick Recipes</h1>
    <h2>HTML</h2>
    <h3>Escape Characters</h3>
    <ul>
        <li>&lt; : &amp;lt;</li>
        <li>&gt; : &amp;gt;</li>
        <li>&amp; : &amp;amp;</li>
        <li>&quot; : &amp;quot;</li>
        <li>&apos; : &amp;apos;</li>
    </ul>
    <h3>Anchor Tag</h3>
    <pre>
        <code>
            &lt;a href="" target="_blank" rel="noopener noreferrer"&gt;Anchor Template&lt;/a&gt;
        </code>
    </pre>
</body>
